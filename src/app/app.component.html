<app-loading-screen [visible]="loading" [progress]="loadProgress" />

<div class="cursor" [style.left.px]="cursorX" [style.top.px]="cursorY"></div>
<div class="site" [class.site--dark]="isDark">
  <div class="page-transition" [class.page-transition--active]="pageTransitioning"></div>
  <app-site-header
    [menuOpen]="menuOpen"
    [isDark]="isDark"
    (themeChange)="toggleTheme()"
    (menuChange)="menuOpen = $event"
  />
  <router-outlet />
</div>
